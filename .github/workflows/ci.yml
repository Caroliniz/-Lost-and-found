name: CI - Verificação do Projeto

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar padrão de código (Lint)
        run: npm run lint

      - name: Rodar testes (Vitest)
        run: npm test -- --run

      - name: Testar compilação (Build)
        run: npm run build